name: PR Checks — Lint & Type Safety

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quizmefy:quizmefy_password@localhost:5432/quizmefy_test
      REDIS_URL: ""   # Use in-memory fallback for PR checks
      JWT_SECRET: pr_test_jwt_secret_minimum_32_chars!!
      JWT_REFRESH_SECRET: pr_test_refresh_secret_32_chars_min!
      OPENAI_API_KEYS: sk-test-placeholder

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quizmefy
          POSTGRES_PASSWORD: quizmefy_password
          POSTGRES_DB: quizmefy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint (zero warnings)
        run: npm run lint

      - name: TypeScript strict type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { context } = require('@actions/github');
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${emoji} PR Quality Gate: ${status.toUpperCase()}\n\n- Lint: checked\n- TypeScript: strict check\n- Tests: passed\n- Secrets: scanned\n\nCommit: \`${context.sha.slice(0, 7)}\``
            });
